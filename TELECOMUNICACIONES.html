<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Telecom · Operaciones</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--dark:#0b1220}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:var(--ink)}
.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(16px);border:1px solid rgba(226,232,240,.85)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 45px rgba(15,23,42,.06)}
.navitem{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:#cbd5e1;text-align:left;font-weight:700;transition:.18s}.navitem:hover,.navitem.active{background:#182235;color:#fff;transform:translateX(2px)}
.tablewrap{overflow:auto}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;outline:none;transition:.18s}.input:focus,.select:focus,.textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(37,99,235,.08)}
.btn{border-radius:14px;padding:11px 15px;font-weight:800;transition:.18s}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{filter:brightness(.96);transform:translateY(-1px)}.btn-soft{background:#eef2f7}.btn-danger{background:#fee2e2;color:#b91c1c}.btn-dark{background:#111827;color:#fff}
.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;inset:auto -20px -30px auto;width:100px;height:100px;border-radius:50%;background:rgba(37,99,235,.07)}
.spinner{width:18px;height:18px;border:2px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fade .18s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.scrollbar::-webkit-scrollbar{height:7px;width:7px}.scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}
.login-bg{background:radial-gradient(circle at 20% 20%,rgba(59,130,246,.25),transparent 30%),radial-gradient(circle at 80% 80%,rgba(14,165,233,.22),transparent 28%),linear-gradient(135deg,#07111f,#0f1e35 50%,#0b1220)}
</style>
</head>
<body>
<div id="app"></div><div id="toasts" class="fixed right-4 bottom-4 z-[500] space-y-3"></div><div id="modalRoot"></div><div id="busy" class="hidden fixed inset-0 z-[450] bg-slate-950/10 backdrop-blur-[2px] place-items-center"><div class="glass rounded-2xl px-5 py-4 flex items-center gap-3 shadow-xl"><span class="spinner"></span><span class="font-bold">Procesando…</span></div></div><iframe id="postFrame" name="postFrame" class="hidden"></iframe>
<script>
/* ========================== CONFIG ========================== */
const CONFIG={GAS_URL:'https://script.google.com/macros/s/AKfycbwZx_5T8B3MBIJf1d9JD7qu5WSauyisvpyIJaI2QVtZNLX8qS_s55241CR3w3o6Xiai5Q/exec',JSONP_TIMEOUT:12000,POST_TIMEOUT:20000,POLL_MS:20000};
/* =========================== STATE =========================== */
const state={token:localStorage.getItem('telecom_token')||'',user:null,role:null,permissions:[],types:[],clients:[],technicians:[],supervisors:[],orders:[],page:'dashboard',notifUnread:0,notifTimer:null,allUsers:[]};
const $=id=>document.getElementById(id); const norm=s=>String(s??'').toLowerCase().trim(); const json=v=>JSON.stringify(v).replace(/'/g,'&#39;');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const has=p=>state.user?.roleId==='OWNER'||state.permissions.includes(p);
/* ============================ UI ============================= */
function toast(msg,type='ok',title='Notificación'){const d=document.createElement('div');d.className='fade card px-4 py-3 min-w-[290px] border-l-4 '+(type==='error'?'border-red-500':'border-blue-500');d.innerHTML=`<div class="font-black">${esc(title)}</div><div class="text-sm text-slate-600 mt-1">${esc(msg)}</div>`;$('toasts').appendChild(d);setTimeout(()=>d.remove(),4200)}
function busy(v){$('busy').classList.toggle('hidden',!v);$('busy').classList.toggle('grid',v)}
function badge(v){const m={COMPLETADA:'bg-emerald-100 text-emerald-700',CERRADA:'bg-emerald-100 text-emerald-700',EN_PROCESO:'bg-blue-100 text-blue-700',ASIGNADA:'bg-indigo-100 text-indigo-700',ACEPTADA:'bg-cyan-100 text-cyan-700',EN_CAMINO:'bg-sky-100 text-sky-700',PAUSADA:'bg-amber-100 text-amber-700',NUEVA:'bg-yellow-100 text-yellow-700',CRITICA:'bg-red-100 text-red-700',ALTA:'bg-orange-100 text-orange-700',ELIMINADO:'bg-red-100 text-red-700',ACTIVO:'bg-emerald-100 text-emerald-700',SUSPENDIDO:'bg-amber-100 text-amber-700',BORRADOR:'bg-slate-100 text-slate-700',ENVIADO:'bg-blue-100 text-blue-700'};return `<span class="badge ${m[v]||'bg-slate-100 text-slate-700'}">${esc(v||'—')}</span>`}
function ensure(){if(!CONFIG.GAS_URL||CONFIG.GAS_URL.includes('PEGAR_AQUI'))throw Error('Configura GAS_URL en Index.html con la URL /exec de Apps Script.');}
/* ========================== API CLIENT ==========================
   Reads + normal writes use JSONP to avoid CORS/iframe delays.
   Evidence upload remains POST because of file size. */
function get(action,args={}){return new Promise((resolve,reject)=>{ensure();const cb='telecom_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');const u=CONFIG.GAS_URL+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(args))+'&callback='+cb;const timer=setTimeout(()=>{clean();reject(Error('Apps Script tardó en responder.'))},CONFIG.JSONP_TIMEOUT);function clean(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=r=>{clean();r?.ok?resolve(r.data):reject(Error(r?.error||'Error del servidor.'))};s.onerror=()=>{clean();reject(Error('No se pudo conectar con Apps Script.'))};s.src=u;document.body.appendChild(s)})}
function post(action,args={}){return new Promise((resolve,reject)=>{ensure();const id='post_'+Date.now()+'_'+Math.random().toString(36).slice(2),f=document.createElement('form');f.method='POST';f.action=CONFIG.GAS_URL;f.target='postFrame';f.style.display='none';[['action',action],['payload',JSON.stringify(args)],['callbackId',id]].forEach(([n,v])=>{const i=document.createElement('input');i.name=n;i.value=v;f.appendChild(i)});document.body.appendChild(f);const timer=setTimeout(()=>{window.removeEventListener('message',handler);f.remove();reject(Error('La carga del archivo tardó demasiado.'))},CONFIG.POST_TIMEOUT);function handler(e){if(e.data?.source!=='portal-telecom-post'||e.data.id!==id)return;clearTimeout(timer);window.removeEventListener('message',handler);f.remove();e.data.result?.ok?resolve(e.data.result.data):reject(Error(e.data.result?.error||'Error del servidor.'))}window.addEventListener('message',handler);f.submit()})}
const call=(action,args={})=>action==='evidence.upload'?post(action,args):get(action,args);
/* ===================== PORTAL MULTIPLATAFORMA =====================
   Esta página solo acepta handoffs para @intersat / INTERSAT.
   La credencial se valida contra este mismo backend GAS mediante
   la operación login existente. No se usa contraseña en la URL.
   ================================================================ */
const PORTAL_HANDOFF_KEY='lc_portal_pending_auth_v1';
const PORTAL_EXPECTED_DOMAIN='intersat';
const PORTAL_EXPECTED_CODE='INTERSAT';
const PORTAL_HANDOFF_MAX_AGE=60*1000;
function readPortalHandoff(){try{const raw=sessionStorage.getItem(PORTAL_HANDOFF_KEY);if(!raw)return null;const d=JSON.parse(raw);const createdAt=Number(d?.createdAt||0),expiresAt=Number(d?.expiresAt||0);if(!d||Date.now()>expiresAt||Date.now()-createdAt>PORTAL_HANDOFF_MAX_AGE){sessionStorage.removeItem(PORTAL_HANDOFF_KEY);return null}return d}catch(e){sessionStorage.removeItem(PORTAL_HANDOFF_KEY);return null}}
function clearPortalHandoff(){try{sessionStorage.removeItem(PORTAL_HANDOFF_KEY)}catch(e){}}
function handoffBelongsToThisPortal(d){return !!d&&String(d.dominio||'').toLowerCase()===PORTAL_EXPECTED_DOMAIN&&String(d.portal||'').toUpperCase()===PORTAL_EXPECTED_CODE&&String(d.usuario||'').trim()!==''&&String(d.password||'')!==''}
async function loginFromPortalHandoff(){const d=readPortalHandoff();if(!d)return false;if(!handoffBelongsToThisPortal(d)){clearPortalHandoff();return false}const usuario=String(d.usuario||'').trim(),password=String(d.password||'');try{clearPortalHandoff();busy(true);const r=await get('login',{email:usuario,password});Object.assign(state,{token:r.token,user:r.user,role:r.role,permissions:r.permissions});localStorage.setItem('telecom_token',state.token);await boot();toast('Sesión iniciada correctamente','ok','Portal Intersat');return true}catch(e){clearPortalHandoff();console.error('Error en acceso multiplataforma Intersat:',e);showLogin('Usuario o contraseña inválidos.');return true}finally{busy(false)}}
/* ============================ LOGIN ============================= */
function showLogin(error=''){clearInterval(state.notifTimer);state.notifTimer=null;$('app').innerHTML=`<div class="min-h-screen login-bg grid lg:grid-cols-[1.1fr_.9fr] text-white"><div class="hidden lg:flex items-center p-14"><div class="max-w-xl"><div class="flex items-center gap-3"><div class="w-14 h-14 rounded-2xl bg-white/10 border border-white/15 grid place-items-center font-black text-xl">LT</div><div><div class="font-black text-xl">LC Soluciones Tecnológicas</div><div class="text-sm text-slate-300">Portal de Operaciones Telecom</div></div></div><h1 class="text-6xl font-black leading-tight mt-10">Controla tu operación.<br><span class="text-blue-300">Conecta tu equipo.</span></h1><p class="text-slate-300 text-lg mt-6 max-w-lg">Instalaciones, averías, técnicos, reportes, evidencias y auditoría en un solo lugar.</p><div class="grid grid-cols-3 gap-3 mt-10"><div class="bg-white/5 border border-white/10 rounded-2xl p-4"><div class="text-2xl">⚡</div><div class="font-bold mt-2">Rápido</div><div class="text-xs text-slate-400">Actualización inmediata</div></div><div class="bg-white/5 border border-white/10 rounded-2xl p-4"><div class="text-2xl">🛡️</div><div class="font-bold mt-2">Seguro</div><div class="text-xs text-slate-400">Roles y auditoría</div></div><div class="bg-white/5 border border-white/10 rounded-2xl p-4"><div class="text-2xl">📡</div><div class="font-bold mt-2">Telecom</div><div class="text-xs text-slate-400">Diseñado para técnicos</div></div></div></div></div><div class="flex items-center justify-center p-6 lg:p-12"><form id="loginForm" class="w-full max-w-md glass text-slate-900 rounded-3xl p-8 shadow-2xl"><div class="w-12 h-12 rounded-2xl bg-blue-600 text-white grid place-items-center font-black">LT</div><div class="mt-6"><div class="text-sm font-bold text-blue-600">ACCESO ADMINISTRATIVO</div><h2 class="text-3xl font-black mt-1">Bienvenido</h2><p class="text-slate-500 mt-2">Ingresa para continuar al portal.</p></div>${error?`<div class="mt-5 rounded-2xl bg-red-50 text-red-700 p-3 text-sm">${esc(error)}</div>`:''}<div class="space-y-4 mt-6"><label class="block text-sm font-bold">Usuario<input id="loginUser" class="input mt-1" required autocomplete="username"></label><label class="block text-sm font-bold">Contraseña<input id="loginPass" class="input mt-1" type="password" required autocomplete="current-password"></label><button class="btn btn-primary w-full py-3.5">Entrar al portal</button></div><div class="mt-5 text-xs text-slate-400">Acceso inicial: <b>cordero</b> / <b>1234</b></div></form></div></div>`; $('loginForm').onsubmit=async e=>{e.preventDefault();try{busy(true);const r=await get('login',{email:$('loginUser').value,password:$('loginPass').value});Object.assign(state,{token:r.token,user:r.user,role:r.role,permissions:r.permissions});localStorage.setItem('telecom_token',state.token);await boot();toast('Sesión iniciada correctamente','ok','Bienvenido')}catch(x){showLogin(x.message)}finally{busy(false)}}}
/* =========================== SHELL ============================== */
function shell(){const nav=[['dashboard','Resumen','dashboard.view','◈'],['orders','Órdenes','orders.view','▣'],['reports','Reportes','reports.view','◌'],['clients','Clientes','clients.view','◎'],['users','Usuarios','users.view','♙'],['audit','Auditoría','audit.view','◫'],['settings','Configuración','settings.view','⚙']].filter(x=>has(x[2]));$('app').innerHTML=`<div id="sideBackdrop" class="hidden fixed inset-0 bg-slate-950/40 z-40" onclick="toggleSide()"></div><div class="min-h-screen flex"><aside id="side" class="fixed lg:static inset-y-0 left-0 z-50 w-72 bg-[#0a1220] text-white p-4 -translate-x-full lg:translate-x-0 transition-transform"><div class="px-2 py-3 flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-blue-600 grid place-items-center font-black">LT</div><div><div class="font-black">Portal Telecom</div><div class="text-xs text-slate-400">V${esc('3.0')}</div></div></div><div class="mt-6 px-3 py-3 rounded-2xl bg-white/5 border border-white/5"><div class="text-xs text-slate-400">Sesión actual</div><div class="font-bold mt-1">${esc((state.user.nombre+' '+state.user.apellido).trim())}</div><div class="text-xs text-blue-300 mt-1">${esc(state.role.nombre)}</div></div><nav class="mt-5 space-y-1">${nav.map(n=>`<button class="navitem" data-page="${n[0]}"><span class="w-6">${n[3]}</span>${n[1]}</button>`).join('')}</nav><div class="absolute bottom-4 left-4 right-4 text-xs text-slate-500">GitHub · GAS · Sheets · Drive</div></aside><main class="flex-1 min-w-0"><header class="h-20 glass sticky top-0 z-30 flex items-center justify-between px-4 lg:px-7"><div class="flex items-center gap-3"><button class="lg:hidden btn btn-soft" onclick="toggleSide()">☰</button><div><div class="font-black text-lg">${esc(state.role.nombre)}</div><div class="text-xs text-slate-500">${esc(state.user.email)}</div></div></div><div class="flex items-center gap-2"><button onclick="notifications()" class="relative btn btn-soft" title="Notificaciones">🔔${state.notifUnread?`<span id="notifBadge" class="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-red-500 text-white text-[10px] grid place-items-center">${state.notifUnread}</span>`:''}</button><button onclick="changePassword()" class="hidden sm:block btn btn-soft">Contraseña</button><button onclick="logout()" class="btn btn-soft">Salir</button></div></header><section id="content" class="p-4 lg:p-7"></section></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function toggleSide(){const s=$('side'),b=$('sideBackdrop');s.classList.toggle('-translate-x-full');b.classList.toggle('hidden')}
function modal(title,body,wide=false){$('modalRoot').innerHTML=`<div class="fixed inset-0 z-[200] bg-slate-950/50 p-4 grid place-items-center"><div class="card w-full ${wide?'max-w-6xl':'max-w-3xl'} max-h-[92vh] overflow-auto fade"><div class="p-5 border-b flex justify-between items-center"><div class="text-xl font-black">${title}</div><button onclick="closeModal()" class="btn btn-soft">✕</button></div><div class="p-5">${body}</div></div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
/* ============================ BOOT ============================== */
async function boot(){shell();await refreshBootstrap(true);await go('dashboard');startNotifPolling()}
async function refreshBootstrap(silent=false){try{const b=await call('bootstrap',{token:state.token});Object.assign(state,{types:b.types||[],clients:b.clients||[],technicians:b.technicians||[],supervisors:b.supervisors||[],orders:b.orders||[],notifUnread:Number(b.unreadNotifications||0)});updateNotifBadge();return b}catch(e){if(!silent)toast(e.message,'error','Conexión');throw e}}
function updateNotifBadge(){const b=$('notifBadge'),btn=document.querySelector('header button[title="Notificaciones"]');if(!btn)return;if(b)b.remove();if(state.notifUnread){const s=document.createElement('span');s.id='notifBadge';s.className='absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-red-500 text-white text-[10px] grid place-items-center';s.textContent=state.notifUnread;btn.appendChild(s)}}
function startNotifPolling(){clearInterval(state.notifTimer);state.notifTimer=setInterval(pollNotifications,CONFIG.POLL_MS)}
async function pollNotifications(){if(!state.token)return;try{const n=await call('notifications.list',{token:state.token});const old=state.notifUnread;state.notifUnread=Number(n.unread||0);updateNotifBadge();if(state.notifUnread>old&&n.items?.[0])toast(n.items[0].mensaje,'ok',n.items[0].titulo)}catch(e){}}
/* ============================ NAV =============================== */
async function go(page){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(window.innerWidth<1024)toggleSide();try{busy(true);if(page==='dashboard')await renderDashboard();if(page==='orders')await renderOrders();if(page==='reports')await renderReports();if(page==='clients')await renderClients();if(page==='users')await renderUsers();if(page==='audit')await renderAudit();if(page==='settings')await renderSettings()}catch(e){toast(e.message,'error','Error')}finally{busy(false)}}
/* =========================== DASHBOARD ========================== */
async function renderDashboard(){const d=await call('dashboard',{token:state.token});const s=d.stats;const cards=[['Órdenes',s.orders,'▣','bg-blue-50 text-blue-600'],['Pendientes',s.pending,'◷','bg-amber-50 text-amber-600'],['En proceso',s.inProgress,'↻','bg-indigo-50 text-indigo-600'],['Completadas',s.completed,'✓','bg-emerald-50 text-emerald-600'],['Críticas',s.critical,'!','bg-red-50 text-red-600']];$('content').innerHTML=`<div class="fade"><div class="flex flex-wrap items-end justify-between gap-4"><div><div class="text-sm font-bold text-blue-600">CENTRO DE OPERACIONES</div><h1 class="text-3xl lg:text-4xl font-black mt-1">Resumen ejecutivo</h1><p class="text-slate-500 mt-2">Actividad visible según tu nivel de acceso.</p></div><div class="text-xs text-slate-400">Actualizado: ${esc(new Date().toLocaleTimeString())}</div></div><div class="grid sm:grid-cols-2 xl:grid-cols-5 gap-4 mt-7">${cards.map(c=>`<div class="card stat p-5"><div class="flex items-center justify-between"><div><div class="text-sm text-slate-500">${c[0]}</div><div class="text-3xl font-black mt-2">${c[1]}</div></div><div class="w-11 h-11 rounded-2xl ${c[3]} grid place-items-center font-black text-lg">${c[2]}</div></div></div>`).join('')}</div><div class="grid xl:grid-cols-[1.35fr_.65fr] gap-5 mt-5"><div class="card p-5"><div class="flex items-center justify-between"><div><h2 class="font-black text-lg">Últimas órdenes</h2><p class="text-sm text-slate-500">Seguimiento operativo</p></div><button onclick="go('orders')" class="text-blue-600 font-bold">Ver órdenes →</button></div><div class="tablewrap mt-4"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b"><th class="p-3">Código</th><th class="p-3">Cliente</th><th class="p-3">Técnico</th><th class="p-3">Estado</th></tr></thead><tbody>${d.recent.map(o=>`<tr class="border-b"><td class="p-3 mono font-bold">${esc(o.codigo)}</td><td class="p-3">${esc(o.clienteNombre)}</td><td class="p-3">${esc(o.tecnicoNombre||'Sin asignar')}</td><td class="p-3">${badge(o.estado)}</td></tr>`).join('')||'<tr><td colspan="4" class="p-8 text-center text-slate-400">Sin órdenes.</td></tr>'}</tbody></table></div></div><div class="card p-5"><div class="font-black text-lg">Acciones rápidas</div><div class="grid gap-3 mt-4">${has('orders.create')?'<button onclick="openOrder()" class="btn btn-primary text-left">＋ Crear nueva orden</button>':''}${has('clients.create')?'<button onclick="openClient()" class="btn btn-soft text-left">＋ Registrar cliente</button>':''}<button onclick="notifications()" class="btn btn-soft text-left">🔔 Ver notificaciones</button></div></div></div></div>`}
/* ============================= ORDERS =========================== */
async function renderOrders(){const mine=state.user.roleId==='TECHNICIAN';$('content').innerHTML=`<div class="fade"><div class="flex flex-wrap justify-between items-end gap-4"><div><div class="text-sm font-bold text-blue-600">OPERACIONES</div><h1 class="text-3xl lg:text-4xl font-black mt-1">Órdenes de trabajo</h1><p class="text-slate-500 mt-2">${mine?'Aquí solo verás las órdenes asignadas a ti.':'Gestiona, asigna y consulta el historial operativo.'}</p></div>${has('orders.create')?'<button onclick="openOrder()" class="btn btn-primary">＋ Nueva orden</button>':''}</div>${has('orders.globalSearch')?`<div class="card p-4 mt-5"><div class="flex flex-col lg:flex-row gap-3"><div class="flex-1"><input id="globalOrderSearch" class="input" placeholder="Buscar cualquier orden, cliente, cédula, teléfono, técnico o código…"></div><button onclick="globalOrderSearch()" class="btn btn-dark">Buscar historial</button></div><div class="text-xs text-slate-400 mt-2">Los resultados de otras cuadrillas son solo lectura.</div><div id="globalResults" class="mt-4"></div></div>`:''}<div class="card p-4 mt-5"><div class="flex flex-col lg:flex-row gap-3"><input id="orderFilter" class="input flex-1" placeholder="Buscar en mis órdenes…" oninput="filterMyOrders(this.value)"><select id="orderStatusFilter" class="select lg:w-56" onchange="filterMyOrders($('orderFilter').value)"><option value="">Todos los estados</option>${['NUEVA','ASIGNADA','ACEPTADA','EN_CAMINO','EN_PROCESO','PAUSADA','COMPLETADA','RECHAZADA','CANCELADA','CERRADA'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="myOrderRows" class="mt-4"></div></div></div>`;renderMyOrders(state.orders)}
function renderMyOrders(rows){$('myOrderRows').innerHTML=`<div class="tablewrap scrollbar"><table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left"><th class="p-3">Orden</th><th class="p-3">Cliente</th><th class="p-3">Técnico</th><th class="p-3">Tipo</th><th class="p-3">Prioridad</th><th class="p-3">Estado</th><th class="p-3"></th></tr></thead><tbody>${rows.map(o=>`<tr class="border-t hover:bg-slate-50"><td class="p-3"><div class="mono font-bold">${esc(o.codigo)}</div><div class="text-xs text-slate-400">${esc(o.titulo)}</div></td><td class="p-3">${esc(o.clienteNombre)}</td><td class="p-3">${esc(o.tecnicoNombre||'Sin asignar')}</td><td class="p-3">${esc((state.types.find(t=>t.id===o.tipoReporteId)||{}).nombre||o.tipoReporteId)}</td><td class="p-3">${badge(o.prioridad)}</td><td class="p-3">${badge(o.estado)}</td><td class="p-3"><button onclick='openOrderDetail(${json(o.id)},false)' class="btn btn-soft">Ver</button></td></tr>`).join('')||'<tr><td colspan="7" class="p-10 text-center text-slate-400">No hay órdenes.</td></tr>'}</tbody></table></div>`}
function filterMyOrders(q){const x=norm(q),s=$('orderStatusFilter')?.value||'';const rows=state.orders.filter(o=>(!x||norm(Object.values(o).join(' ')).includes(x))&&(!s||o.estado===s));renderMyOrders(rows)}
async function globalOrderSearch(){const q=$('globalOrderSearch').value.trim();if(q.length<2){toast('Escribe al menos 2 caracteres.','error','Búsqueda');return}try{const a=await call('orders.searchGlobal',{token:state.token,search:q});$('globalResults').innerHTML=a.map(o=>`<div class="flex flex-wrap items-center justify-between gap-3 border rounded-2xl p-4 mb-2"><div><div class="mono font-black">${esc(o.codigo)}</div><div class="text-sm">${esc(o.clienteNombre)} · ${esc(o.tecnicoNombre||'Sin asignar')}</div><div class="text-xs text-slate-500 mt-1">${esc(o.titulo)} · ${badge(o.estado)}</div></div><button onclick='openOrderDetail(${json(o.id)},true)' class="btn btn-soft">Solo lectura</button></div>`).join('')||'<div class="text-center text-slate-400 p-5">Sin resultados.</div>'}catch(e){toast(e.message,'error','Búsqueda')}}

function orderFormData(o={}){const techOpts=state.technicians.map(t=>`<option value="${esc(t.id)}" ${o.tecnicoId===t.id?'selected':''}>${esc((t.nombre+' '+t.apellido).trim())}</option>`).join('');const supOpts=state.supervisors.map(t=>`<option value="${esc(t.id)}" ${o.supervisorId===t.id?'selected':''}>${esc((t.nombre+' '+t.apellido).trim())}</option>`).join('');return `<form id="orderForm" class="grid md:grid-cols-2 gap-3"><input id="odId" type="hidden" value="${esc(o.id||'')}"><label class="text-sm font-bold">Tipo de reporte<select id="odType" class="select mt-1" required>${state.types.map(t=>`<option value="${esc(t.id)}" ${o.tipoReporteId===t.id?'selected':''}>${esc(t.nombre)} · ${esc(t.categoria)}</option>`).join('')}</select></label><label class="text-sm font-bold">Cliente<select id="odClient" class="select mt-1" required>${state.clients.map(c=>`<option value="${esc(c.id)}" ${o.clienteId===c.id?'selected':''}>${esc(c.codigo+' · '+c.nombre)}</option>`).join('')}</select></label><label class="text-sm font-bold">Prioridad<select id="odPriority" class="select mt-1">${['BAJA','MEDIA','ALTA','CRITICA'].map(x=>`<option ${o.prioridad===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="text-sm font-bold">Fecha programada<input id="odDate" type="datetime-local" class="input mt-1" value="${esc(o.fechaProgramada||'')}"></label><label class="text-sm font-bold md:col-span-2">Título<input id="odTitle" class="input mt-1" required value="${esc(o.titulo||'')}" placeholder="Ej. Instalación FTTH cliente residencial"></label><label class="text-sm font-bold md:col-span-2">Descripción / instrucciones<textarea id="odDesc" class="textarea mt-1" rows="4">${esc(o.descripcion||'')}</textarea></label><label class="text-sm font-bold">Técnico asignado<select id="odTech" class="select mt-1"><option value="">Sin asignar</option>${techOpts}</select></label><label class="text-sm font-bold">Supervisor<select id="odSup" class="select mt-1"><option value="">Seleccionar</option>${supOpts}</select></label><label class="text-sm font-bold">Latitud inicial<input id="odLat1" class="input mt-1" value="${esc(o.latInicio||'')}" placeholder="Opcional"></label><label class="text-sm font-bold">Longitud inicial<input id="odLng1" class="input mt-1" value="${esc(o.lngInicio||'')}" placeholder="Opcional"></label><div class="md:col-span-2 flex justify-end gap-2"><button type="button" onclick="closeModal()" class="btn btn-soft">Cancelar</button><button class="btn btn-primary">Guardar orden</button></div></form>`}
function openOrder(id=''){if(state.user.roleId==='TECHNICIAN')return;const o=state.orders.find(x=>x.id===id)||{};modal(id?'Editar orden':'Nueva orden',orderFormData(o));$('orderForm').onsubmit=async e=>{e.preventDefault();const data={id:id||undefined,tipoReporteId:$('odType').value,clienteId:$('odClient').value,prioridad:$('odPriority').value,fechaProgramada:$('odDate').value,titulo:$('odTitle').value,descripcion:$('odDesc').value,tecnicoId:$('odTech').value,supervisorId:$('odSup').value,latInicio:$('odLat1').value,lngInicio:$('odLng1').value};try{busy(true);const r=await call(id?'orders.edit':'orders.save',{token:state.token,data});replaceOrder(r.order);closeModal();toast(r.message,'ok','Orden');renderMyOrders(state.orders)}catch(x){toast(x.message,'error','Orden')}finally{busy(false)}}}
async function openOrderDetail(id,readOnlyGlobal){try{busy(true);const d=await call('orders.detail',{token:state.token,id,globalRead:readOnlyGlobal});const o=d.order,c=d.client||{},r=d.report||null,ro=!!d.readOnly;const canEdit=!ro&&has('orders.edit')&&(state.user.roleId!=='TECHNICIAN'||String(o.tecnicoId)===String(state.user.id));const canAssign=!ro&&has('orders.assign')&&state.user.roleId!=='TECHNICIAN';const canDelete=!ro&&has('orders.delete')&&['OWNER','SUPER_ADMIN'].includes(state.user.roleId);const reportText=r?`<div class="grid md:grid-cols-2 gap-3"><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Diagnóstico</div><div class="mt-2 whitespace-pre-wrap">${esc(r.diagnostico)}</div></div><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Trabajo realizado</div><div class="mt-2 whitespace-pre-wrap">${esc(r.trabajoRealizado)}</div></div><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Solución</div><div class="mt-2 whitespace-pre-wrap">${esc(r.solucion)}</div></div><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Mediciones</div><pre class="text-xs mt-2 whitespace-pre-wrap">${esc(JSON.stringify(r.mediciones||{},null,2))}</pre></div><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Repuestos / materiales</div><pre class="text-xs mt-2 whitespace-pre-wrap">${esc(JSON.stringify(r.repuestos||[],null,2))}</pre></div><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Cliente conforme</div><div class="mt-2 font-bold">${esc(r.conformidadCliente||'NO')}</div><div class="text-xs text-slate-500 mt-2">Firma / nombre</div><div class="mt-1">${esc(r.firmaCliente||'—')}</div></div></div>`:'<div class="rounded-2xl bg-amber-50 text-amber-700 p-4">El técnico todavía no ha enviado un reporte para esta orden.</div>';
  modal(`Orden ${esc(o.codigo)} ${ro?'<span class="text-sm text-slate-400">· SOLO LECTURA</span>':''}`,`<div class="space-y-6"><div class="grid md:grid-cols-4 gap-3"><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Cliente</div><div class="font-bold mt-1">${esc(c.nombre||o.clienteNombre)}</div><div class="text-xs text-slate-500">${esc(c.identificacion||'')}</div></div><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Técnico</div><div class="font-bold mt-1">${esc(o.tecnicoNombre||'Sin asignar')}</div></div><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Estado</div><div class="mt-1">${badge(o.estado)}</div></div><div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">Prioridad</div><div class="mt-1">${badge(o.prioridad)}</div></div></div><div><div class="text-sm font-bold text-slate-500">TRABAJO</div><h3 class="text-2xl font-black mt-1">${esc(o.titulo)}</h3><p class="text-slate-600 mt-2 whitespace-pre-wrap">${esc(o.descripcion)}</p></div><div class="flex flex-wrap gap-2">${canEdit?`<button onclick='openOrder(${json(o.id)})' class="btn btn-primary">Editar orden</button>`:''}${canAssign?`<button onclick='assignOrder(${json(o.id)})' class="btn btn-soft">Asignar técnico</button>`:''}${canDelete?`<button onclick='deleteOrder(${json(o.id)})' class="btn btn-danger">Eliminar orden</button>`:''}${!ro&&has('reports.create')&&(state.user.roleId!=='TECHNICIAN'||String(o.tecnicoId)===String(state.user.id))?`<button onclick='openReport(${json(o.id)},${json(r||{})})' class="btn btn-dark">${r?'Editar reporte':'Crear reporte'}</button>`:''}</div><div class="border-t pt-5"><div class="flex items-center justify-between mb-3"><h3 class="text-lg font-black">Reporte del técnico</h3>${r?badge(r.estado):''}</div>${reportText}</div><div class="border-t pt-5"><h3 class="text-lg font-black">Evidencias</h3><div class="mt-3 space-y-2">${(d.evidence||[]).map(e=>`<div class="flex justify-between border rounded-2xl p-3"><div><b>${esc(e.nombreArchivo)}</b><div class="text-xs text-slate-500">${esc(e.tipo)} · ${esc(e.creadoEn)}</div></div><a target="_blank" href="${esc(e.url)}" class="btn btn-soft">Abrir</a></div>`).join('')||'<div class="text-slate-400">No hay evidencias.</div>'}</div></div></div>`,true);
 }catch(e){toast(e.message,'error','Orden')}finally{busy(false)}}
function replaceOrder(o){const i=state.orders.findIndex(x=>x.id===o.id);if(i>=0)state.orders[i]=o;else state.orders.unshift(o);state.orders=state.orders.slice(0,300)}
async function assignOrder(id){const opts=state.technicians.map(t=>`<option value="${esc(t.id)}">${esc((t.nombre+' '+t.apellido).trim())}</option>`).join('');modal('Asignar técnico',`<form id="assignForm"><select id="assignTech" class="select" required><option value="">Seleccionar técnico…</option>${opts}</select><button class="btn btn-primary w-full mt-4">Asignar orden</button></form>`);$('assignForm').onsubmit=async e=>{e.preventDefault();try{busy(true);const r=await call('orders.assign',{token:state.token,id,tecnicoId:$('assignTech').value});replaceOrder(r.order);closeModal();toast(r.message,'ok','Asignación');renderMyOrders(state.orders)}catch(x){toast(x.message,'error','Asignación')}finally{busy(false)}}}
async function setStatus(id,status){try{busy(true);const r=await call('orders.status',{token:state.token,id,estado:status});replaceOrder(r.order);closeModal();toast(r.message,'ok','Orden');renderMyOrders(state.orders);await pollNotifications()}catch(e){toast(e.message,'error','Orden')}finally{busy(false)}}
async function deleteOrder(id){if(!confirm('¿Eliminar esta orden? La acción quedará registrada en auditoría.'))return;try{busy(true);await call('orders.delete',{token:state.token,id});state.orders=state.orders.filter(x=>x.id!==id);closeModal();toast('Orden eliminada','ok','Orden');renderMyOrders(state.orders)}catch(e){toast(e.message,'error','Orden')}finally{busy(false)}}

function openReport(orderId,r={}){const m=r.mediciones||{};modal('Reporte técnico',`<form id="reportForm" class="grid md:grid-cols-2 gap-3"><label class="text-sm font-bold md:col-span-2">Diagnóstico<textarea id="rd" class="textarea mt-1" rows="4">${esc(r.diagnostico||'')}</textarea></label><label class="text-sm font-bold md:col-span-2">Trabajo realizado<textarea id="rw" class="textarea mt-1" rows="4">${esc(r.trabajoRealizado||'')}</textarea></label><label class="text-sm font-bold md:col-span-2">Solución aplicada<textarea id="rs" class="textarea mt-1" rows="4">${esc(r.solucion||'')}</textarea></label><div class="md:col-span-2 border rounded-2xl p-4"><div class="font-black mb-3">Mediciones técnicas</div><div class="grid sm:grid-cols-2 lg:grid-cols-5 gap-3"><input id="mRx" class="input" placeholder="Potencia RX" value="${esc(m.rx||'')}"><input id="mTx" class="input" placeholder="Potencia TX" value="${esc(m.tx||'')}"><input id="mRssi" class="input" placeholder="RSSI" value="${esc(m.rssi||'')}"><input id="mSnr" class="input" placeholder="SNR" value="${esc(m.snr||'')}"><input id="mCcq" class="input" placeholder="CCQ" value="${esc(m.ccq||'')}"><input id="mOtdr" class="input" placeholder="OTDR" value="${esc(m.otdr||'')}"></div></div><label class="text-sm font-bold">Cliente conforme<select id="rok" class="select mt-1"><option value="SI" ${r.conformidadCliente==='SI'?'selected':''}>Sí</option><option value="NO" ${r.conformidadCliente!=='SI'?'selected':''}>No</option></select></label><label class="text-sm font-bold">Firma / nombre del cliente<input id="rfi" class="input mt-1" value="${esc(r.firmaCliente||'')}" placeholder="Nombre o referencia"></label><label class="text-sm font-bold md:col-span-2">Repuestos / materiales<textarea id="rrep" class="textarea mt-1" rows="3" placeholder="Uno por línea">${esc((r.repuestos||[]).join('\n'))}</textarea></label><label class="text-sm font-bold">Estado<select id="rst" class="select mt-1"><option value="BORRADOR" ${r.estado==='BORRADOR'?'selected':''}>Borrador</option><option value="ENVIADO" ${r.estado==='ENVIADO'?'selected':''}>Enviado a revisión</option></select></label><div class="md:col-span-2 flex justify-end gap-2"><button type="button" onclick="closeModal()" class="btn btn-soft">Cancelar</button><button class="btn btn-primary">Guardar reporte</button></div></form>`);$('reportForm').onsubmit=async e=>{e.preventDefault();try{busy(true);const x=await call('reports.save',{token:state.token,data:{ordenId:orderId,diagnostico:$('rd').value,trabajoRealizado:$('rw').value,solucion:$('rs').value,mediciones:{rx:$('mRx').value,tx:$('mTx').value,rssi:$('mRssi').value,snr:$('mSnr').value,ccq:$('mCcq').value,otdr:$('mOtdr').value},repuestos:$('rrep').value.split('\n').map(s=>s.trim()).filter(Boolean),conformidadCliente:$('rok').value==='SI',firmaCliente:$('rfi').value,estado:$('rst').value}});closeModal();toast(x.message,'ok','Reporte');await openOrderDetail(orderId,false)}catch(err){toast(err.message,'error','Reporte')}finally{busy(false)}}}

async function renderClients(){const clients=await call('clients.list',{token:state.token,search:''});state.clients=clients;$('content').innerHTML=`<div class="fade"><div class="flex flex-wrap justify-between items-end gap-4"><div><div class="text-sm font-bold text-blue-600">MAESTRO DE CLIENTES</div><h1 class="text-3xl lg:text-4xl font-black mt-1">Clientes</h1><p class="text-slate-500 mt-2">Información completa y editable según permisos.</p></div>${has('clients.create')?'<button onclick="openClient()" class="btn btn-primary">＋ Nuevo cliente</button>':''}</div><div class="card p-4 mt-5"><input id="clientSearch" class="input" placeholder="Buscar por cualquier dato…" oninput="filterClients(this.value)"><div id="clientRows" class="mt-4"></div></div></div>`;renderClientRows(clients)}
function renderClientRows(a){$('clientRows').innerHTML=`<div class="tablewrap"><table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left"><th class="p-3">Código</th><th class="p-3">Cliente</th><th class="p-3">Identificación</th><th class="p-3">Contacto</th><th class="p-3">Servicio</th><th class="p-3">Plan</th><th class="p-3">Tecnología</th><th class="p-3"></th></tr></thead><tbody>${a.map(c=>`<tr class="border-t"><td class="p-3 mono">${esc(c.codigo)}</td><td class="p-3"><b>${esc(c.nombre)}</b><div class="text-xs text-slate-500">${esc(c.email)}</div></td><td class="p-3">${esc(c.identificacion)}</td><td class="p-3">${esc(c.telefono)}<div class="text-xs text-slate-500">${esc(c.direccion)}</div></td><td class="p-3">${esc(c.servicio)}</td><td class="p-3">${esc(c.plan)}</td><td class="p-3">${esc(c.tecnologia)}</td><td class="p-3 flex gap-2">${has('clients.edit')?`<button onclick='openClient(${json(c.id)})' class="btn btn-soft">Editar</button>`:''}${has('clients.delete')?`<button onclick='deleteClient(${json(c.id)})' class="btn btn-danger">Eliminar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="p-10 text-center text-slate-400">Sin clientes.</td></tr>'}</tbody></table></div>`}
function filterClients(q){const x=norm(q);renderClientRows(state.clients.filter(c=>norm(Object.values(c).join(' ')).includes(x)))}
function clientForm(c={}){return `<form id="clientForm" class="grid md:grid-cols-2 gap-3"><input id="cid" type="hidden" value="${esc(c.id||'')}"><label class="text-sm font-bold md:col-span-2">Nombre / razón social<input id="cn" class="input mt-1" required value="${esc(c.nombre||'')}"></label><label class="text-sm font-bold">Cédula / RIF<input id="ci" class="input mt-1" value="${esc(c.identificacion||'')}"></label><label class="text-sm font-bold">Teléfono<input id="ct" class="input mt-1" value="${esc(c.telefono||'')}"></label><label class="text-sm font-bold">Correo<input id="ce" type="email" class="input mt-1" value="${esc(c.email||'')}"></label><label class="text-sm font-bold">Servicio<input id="csv" class="input mt-1" value="${esc(c.servicio||'')}"></label><label class="text-sm font-bold">Plan<input id="cp" class="input mt-1" value="${esc(c.plan||'')}"></label><label class="text-sm font-bold">Tecnología<select id="ctech" class="select mt-1">${['','FIBRA','INALAMBRICO','HFC','OTRO'].map(x=>`<option value="${x}" ${c.tecnologia===x?'selected':''}>${x||'Seleccionar'}</option>`).join('')}</select></label><label class="text-sm font-bold">Estado<select id="cst" class="select mt-1">${['ACTIVO','SUSPENDIDO'].map(x=>`<option ${c.estado===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="text-sm font-bold">Latitud<input id="cla" class="input mt-1" value="${esc(c.latitud||'')}"></label><label class="text-sm font-bold">Longitud<input id="clo" class="input mt-1" value="${esc(c.longitud||'')}"></label><label class="text-sm font-bold md:col-span-2">Dirección<textarea id="cad" class="textarea mt-1" rows="3">${esc(c.direccion||'')}</textarea></label><label class="text-sm font-bold md:col-span-2">Observaciones<textarea id="cob" class="textarea mt-1" rows="3">${esc(c.observaciones||'')}</textarea></label><div class="md:col-span-2 flex justify-end"><button class="btn btn-primary">Guardar cliente</button></div></form>`}
function openClient(id=''){const c=state.clients.find(x=>x.id===id)||{};modal(id?'Editar cliente':'Nuevo cliente',clientForm(c));$('clientForm').onsubmit=async e=>{e.preventDefault();const data={id:id||undefined,nombre:$('cn').value,identificacion:$('ci').value,telefono:$('ct').value,email:$('ce').value,servicio:$('csv').value,plan:$('cp').value,tecnologia:$('ctech').value,estado:$('cst').value,latitud:$('cla').value,longitud:$('clo').value,direccion:$('cad').value,observaciones:$('cob').value};try{busy(true);const r=await call(id?'clients.edit':'clients.save',{token:state.token,data});const i=state.clients.findIndex(x=>x.id===r.client.id);if(i>=0)state.clients[i]=r.client;else state.clients.unshift(r.client);closeModal();toast(id?'Cliente actualizado':'Cliente creado','ok','Clientes');renderClients()}catch(e){toast(e.message,'error','Clientes')}finally{busy(false)}}}
async function deleteClient(id){if(!confirm('¿Eliminar este cliente? Las órdenes históricas conservarán su referencia.'))return;try{busy(true);await call('clients.delete',{token:state.token,id});state.clients=state.clients.filter(x=>x.id!==id);toast('Cliente eliminado','ok','Clientes');renderClients()}catch(e){toast(e.message,'error','Clientes')}finally{busy(false)}}
/* ============================== USERS ============================ */
async function renderUsers(){state.allUsers=await call('users.list',{token:state.token,search:''});$('content').innerHTML=`<div class="fade"><div class="flex flex-wrap justify-between items-end gap-4"><div><div class="text-sm font-bold text-blue-600">ADMINISTRACIÓN</div><h1 class="text-3xl lg:text-4xl font-black mt-1">Usuarios</h1><p class="text-slate-500 mt-2">Cuentas, roles y estados.</p></div>${has('users.create')?'<button onclick="openUser()" class="btn btn-primary">＋ Nuevo usuario</button>':''}</div><div class="card p-4 mt-5"><input id="userSearch" class="input" placeholder="Buscar usuario, rol, empresa o sucursal…" oninput="filterUsers(this.value)"><div id="userRows" class="mt-4"></div></div></div>`;renderUserRows(state.allUsers)}
function renderUserRows(a){$('userRows').innerHTML=`<div class="tablewrap"><table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left"><th class="p-3">Usuario</th><th class="p-3">Rol</th><th class="p-3">Empresa</th><th class="p-3">Sucursal</th><th class="p-3">Estado</th><th class="p-3"></th></tr></thead><tbody>${a.map(u=>`<tr class="border-t"><td class="p-3"><b>${esc((u.nombre+' '+u.apellido).trim())}</b><div class="text-xs text-slate-500">${esc(u.email)}</div></td><td class="p-3">${esc(u.roleId)}</td><td class="p-3">${esc(u.empresa)}</td><td class="p-3">${esc(u.sucursal)}</td><td class="p-3">${badge(u.estado)}</td><td class="p-3 flex gap-2">${has('users.edit')&&u.roleId!=='OWNER'?`<button onclick='editUser(${json(u.id)})' class="btn btn-soft">Editar</button>`:''}${has('users.delete')&&u.roleId!=='OWNER'?`<button onclick='deleteUser(${json(u.id)})' class="btn btn-danger">Eliminar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function filterUsers(q){const x=norm(q);renderUserRows(state.allUsers.filter(u=>norm(Object.values(u).join(' ')).includes(x)))}
function userForm(u={}){return `<form id="userForm" class="grid md:grid-cols-2 gap-3"><input id="uid" type="hidden" value="${esc(u.id||'')}"><label class="text-sm font-bold">Nombre<input id="un" class="input mt-1" required value="${esc(u.nombre||'')}"></label><label class="text-sm font-bold">Apellido<input id="ua" class="input mt-1" value="${esc(u.apellido||'')}"></label><label class="text-sm font-bold">Usuario<input id="ue" class="input mt-1" required value="${esc(u.email||'')}"></label><label class="text-sm font-bold">Teléfono<input id="ut" class="input mt-1" value="${esc(u.telefono||'')}"></label><label class="text-sm font-bold">Rol<select id="ur" class="select mt-1">${[['TECHNICIAN','Técnico'],['SUPERVISOR','Supervisor'],['AUDITOR','Auditor'],['WAREHOUSE','Almacén'],['SUPER_ADMIN','Super Administrador'],...(state.user.roleId==='OWNER'?[['OWNER','Propietario']]:[])].map(x=>`<option value="${x[0]}" ${u.roleId===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label class="text-sm font-bold">Estado<select id="us" class="select mt-1">${['ACTIVO','SUSPENDIDO'].map(x=>`<option ${u.estado===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="text-sm font-bold">Empresa<input id="uc" class="input mt-1" value="${esc(u.empresa||'Principal')}"></label><label class="text-sm font-bold">Sucursal<input id="ub" class="input mt-1" value="${esc(u.sucursal||'Central')}"></label><label class="text-sm font-bold md:col-span-2">${u.id?'Nueva contraseña (opcional)':'Contraseña'}<input id="up" class="input mt-1" type="password" ${u.id?'':'required minlength="4"'}></label><div class="md:col-span-2 flex justify-end"><button class="btn btn-primary">Guardar usuario</button></div></form>`}
function openUser(u={}){modal(u.id?'Editar usuario':'Nuevo usuario',userForm(u));$('userForm').onsubmit=async e=>{e.preventDefault();try{busy(true);const d={id:$('uid').value||undefined,nombre:$('un').value,apellido:$('ua').value,email:$('ue').value,telefono:$('ut').value,roleId:$('ur').value,estado:$('us').value,empresa:$('uc').value,sucursal:$('ub').value,password:$('up').value};const r=await call(u.id?'users.edit':'users.save',{token:state.token,data:d});closeModal();toast(u.id?'Usuario actualizado':'Usuario creado','ok','Usuarios');await renderUsers();await refreshBootstrap(true)}catch(e){toast(e.message,'error','Usuarios')}finally{busy(false)}}}
function editUser(id){const u=state.allUsers.find(x=>x.id===id);if(u)openUser(u)}
async function deleteUser(id){if(!confirm('¿Eliminar este usuario? La acción quedará auditada.'))return;try{busy(true);await call('users.delete',{token:state.token,id});toast('Usuario eliminado','ok','Usuarios');await renderUsers();await refreshBootstrap(true)}catch(e){toast(e.message,'error','Usuarios')}finally{busy(false)}}
/* ============================== REPORTS ========================== */
async function renderReports(){const a=await call('reports.list',{token:state.token,search:''});$('content').innerHTML=`<div class="fade"><div class="text-sm font-bold text-blue-600">SUPERVISIÓN</div><h1 class="text-3xl lg:text-4xl font-black mt-1">Reportes técnicos</h1><p class="text-slate-500 mt-2">Consulta lo que los técnicos han registrado en sus órdenes.</p><div class="card p-5 mt-5 tablewrap"><table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left"><th class="p-3">Orden</th><th class="p-3">Técnico</th><th class="p-3">Diagnóstico</th><th class="p-3">Estado</th><th class="p-3"></th></tr></thead><tbody>${a.map(r=>{const o=state.orders.find(x=>x.id===r.ordenId);return`<tr class="border-t"><td class="p-3 mono">${esc(o?.codigo||r.ordenId)}</td><td class="p-3">${esc(o?.tecnicoNombre||'-')}</td><td class="p-3 max-w-sm">${esc(r.diagnostico)}</td><td class="p-3">${badge(r.estado)}</td><td class="p-3"><button onclick='openOrderDetail(${json(r.ordenId)},false)' class="btn btn-soft">Ver orden</button></td></tr>`}).join('')||'<tr><td colspan="5" class="p-10 text-center text-slate-400">Sin reportes.</td></tr>'}</tbody></table></div></div>`}
/* ============================== AUDIT ============================ */
async function renderAudit(){const a=await call('audit.list',{token:state.token});$('content').innerHTML=`<div class="fade"><div class="text-sm font-bold text-blue-600">CONTROL</div><h1 class="text-3xl lg:text-4xl font-black mt-1">Auditoría</h1><p class="text-slate-500 mt-2">Cada movimiento importante del portal queda registrado.</p><div class="card p-4 mt-5"><input id="auditSearch" class="input" placeholder="Buscar por usuario, acción, módulo o descripción…" oninput="filterAudit(this.value)"><div id="auditRows" class="mt-4"></div></div></div>`;state.auditRows=a;renderAuditRows(a)}
function renderAuditRows(a){$('auditRows').innerHTML=`<div class="tablewrap"><table class="w-full text-sm"><thead><tr class="bg-slate-50 text-left"><th class="p-3">Fecha</th><th class="p-3">Usuario</th><th class="p-3">Acción</th><th class="p-3">Módulo</th><th class="p-3">Descripción</th></tr></thead><tbody>${a.map(x=>`<tr class="border-t"><td class="p-3 mono text-xs">${esc(x.fecha)}</td><td class="p-3">${esc(x.usuarioEmail)}</td><td class="p-3">${badge(x.accion)}</td><td class="p-3">${esc(x.modulo)}</td><td class="p-3">${esc(x.descripcion)}</td></tr>`).join('')}</tbody></table></div>`}function filterAudit(q){const x=norm(q);renderAuditRows(state.auditRows.filter(a=>norm(Object.values(a).join(' ')).includes(x)))}
/* =========================== NOTIFICATIONS ====================== */
async function notifications(){try{const n=await call('notifications.list',{token:state.token});state.notifUnread=Number(n.unread||0);updateNotifBadge();modal('Notificaciones',`<div class="flex justify-between items-center mb-4"><div class="text-sm text-slate-500">${state.notifUnread} pendientes</div>${state.notifUnread?'<button onclick="markAllRead()" class="btn btn-soft">Marcar todas como leídas</button>':''}</div><div>${(n.items||[]).map(x=>`<button onclick='readNotification(${json(x.id)})' class="w-full text-left border rounded-2xl p-4 mb-2 hover:bg-slate-50 ${String(x.leida)==='true'?'opacity-65':'bg-blue-50/70 border-blue-100'}"><div class="flex items-start gap-3"><div class="w-10 h-10 rounded-xl bg-slate-900 text-white grid place-items-center">${String(x.leida)==='true'?'✓':'!'}</div><div class="flex-1"><b>${esc(x.titulo)}</b><div class="text-sm text-slate-600 mt-1">${esc(x.mensaje)}</div><div class="text-xs text-slate-400 mt-2">${esc(x.creadoEn)}</div></div></div></button>`).join('')||'<div class="p-8 text-center text-slate-400">No hay notificaciones.</div>'}</div>`)}catch(e){toast(e.message,'error','Notificaciones')}}
async function readNotification(id){try{const r=await call('notifications.read',{token:state.token,id});state.notifUnread=Number(r.unread||0);updateNotifBadge();toast('Notificación marcada como leída');notifications()}catch(e){toast(e.message,'error','Notificaciones')}}
async function markAllRead(){try{await call('notifications.markAll',{token:state.token});state.notifUnread=0;updateNotifBadge();toast('Todas las notificaciones fueron marcadas como leídas');notifications()}catch(e){toast(e.message,'error','Notificaciones')}}
/* ============================ SETTINGS ========================== */
async function renderSettings(){if(!has('settings.view'))return;const v=await call('system.verify',{token:state.token});$('content').innerHTML=`<div class="fade"><div class="text-sm font-bold text-blue-600">SISTEMA</div><h1 class="text-3xl lg:text-4xl font-black mt-1">Configuración</h1><p class="text-slate-500 mt-2">Estado de conexión y estructura de datos.</p><div class="grid lg:grid-cols-2 gap-5 mt-6"><div class="card p-5"><div class="font-black text-lg">Conexión GAS</div><div class="mt-3 p-4 rounded-2xl bg-slate-950 text-white text-xs break-all">${esc(CONFIG.GAS_URL)}</div><div class="text-sm text-slate-500 mt-3">Versión backend: <b>${esc(v.version)}</b></div>${has('settings.manage')?'<button onclick="repairSystem()" class="btn btn-primary mt-4">Revisar / reparar estructura</button>':''}</div><div class="card p-5"><div class="font-black text-lg">Google Sheets</div><div class="mt-3 space-y-2 max-h-[500px] overflow-auto">${v.hojas.map(x=>`<div class="flex justify-between py-2 border-b text-sm"><span>${esc(x.hoja)}</span><b class="${x.existe&&x.encabezadosCorrectos?'text-emerald-600':'text-red-600'}">${x.existe&&x.encabezadosCorrectos?'OK':'REVISAR'}</b></div>`).join('')}</div><a href="${esc(v.spreadsheetUrl)}" target="_blank" class="btn btn-soft inline-block mt-4">Abrir base de datos</a></div></div></div>`}
async function repairSystem(){try{busy(true);const r=await call('system.setup',{token:state.token});toast(r.message,'ok','Sistema');await refreshBootstrap(true);await renderSettings()}catch(e){toast(e.message,'error','Sistema')}finally{busy(false)}}
/* ========================= PASSWORD / LOGOUT ==================== */
function changePassword(){modal('Cambiar contraseña',`<form id="pwdForm" class="space-y-4"><input id="oldPwd" class="input" type="password" placeholder="Contraseña actual" required><input id="newPwd" class="input" type="password" minlength="4" placeholder="Nueva contraseña" required><input id="newPwd2" class="input" type="password" minlength="4" placeholder="Repite la nueva contraseña" required><button class="btn btn-primary w-full">Guardar contraseña</button></form>`);$('pwdForm').onsubmit=async e=>{e.preventDefault();if($('newPwd').value!==$('newPwd2').value){toast('Las nuevas contraseñas no coinciden.','error');return}try{busy(true);await call('account.password',{token:state.token,currentPassword:$('oldPwd').value,newPassword:$('newPwd').value});closeModal();toast('Contraseña cambiada correctamente','ok','Seguridad')}catch(x){toast(x.message,'error','Seguridad')}finally{busy(false)}}}
async function logout(){try{await call('logout',{token:state.token})}catch(e){}clearPortalHandoff();clearInterval(state.notifTimer);localStorage.removeItem('telecom_token');state.token='';showLogin()}
/* =========================== STARTUP ============================= */
(async()=>{try{ensure();const handoff=readPortalHandoff();if(handoffBelongsToThisPortal(handoff)){localStorage.removeItem('telecom_token');state.token='';await loginFromPortalHandoff();return}if(state.token){const m=await get('me',{token:state.token});Object.assign(state,{user:m.user,role:m.role,permissions:m.permissions});await boot()}else showLogin()}catch(e){localStorage.removeItem('telecom_token');state.token='';clearPortalHandoff();showLogin(e.message)}})();
</script>
</body></html>
